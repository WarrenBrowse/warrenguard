[package]
name = "warrenguard-tun-core"
description = "Safe, always-on TUN seam for the WarrenGuard datapath: OS-agnostic framing, RawTunDevice/TunIo traits + adapter, gateway parsing, routing/killswitch plan. Zero unsafe, zero deps."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]

[dev-dependencies]
# Dev-only (does not taint the zero-dep production build): cross-checks that
# `plan::MACOS_TUN_GATEWAY_IP` cannot silently drift from the shared
# `TUNNEL_GATEWAY_IP` constant (see the `plan` module tests).
warrenguard-config = { path = "../warrenguard-config" }

[features]
# Gates the live-host routing-table probes (`gateway::discover_default_gateway`
# runs `ip` / `netstat`). No privileged code and no extra dependencies: the gate
# just keeps the process-calling helpers out of a pure userland build's surface,
# mirroring the `warrenguard-tun-device` feature of the same name.
experimental-tun = []

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
