# WarrenGuard engine crate: the cryptographically-blind QUIC relay forwarder for
# the multi-hop path. Forwards sealed frames between client and exit without ever
# decrypting them. No Warren-specific logic; deployers ship their own relay
# binary + ops tooling around this crate.
[package]
name = "warrenguard-relay"
description = "Cryptographically-blind QUIC relay forwarder for the multi-hop path (WarrenGuard engine)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
warrenguard-transport-core = { path = "../warrenguard-transport-core" }
warrenguard-tls = { path = "../warrenguard-tls" }
warrenguard-multihop = { path = "../warrenguard-multihop" }
warrenguard-config = { path = "../warrenguard-config" }
quinn = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
ed25519-dalek = { workspace = true }
parking_lot = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "macros", "net", "time"] }
hex = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
# Mint an in-memory test CA + cover-domain leaf for the X.509
# relay->exit C2 dial test (x509_c2_dial.rs).
rcgen = { workspace = true }

[lints]
workspace = true
