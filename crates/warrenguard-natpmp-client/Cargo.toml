# WarrenGuard engine crate: a generic VPN-over-QUIC building block with no
# Warren-specific logic, reusable by any deployer.
[package]
name = "warrenguard-natpmp-client"
description = "NAT-PMP client (RFC 6886) used by the tunnel daemon (WarrenGuard engine)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
warrenguard-config = { path = "../warrenguard-config" }
warrenguard-natpmp-protocol = { path = "../warrenguard-natpmp-protocol" }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
warrenguard-natpmp-server = { path = "../warrenguard-natpmp-server" }

[dependencies.clap]
workspace = true

[dependencies.tracing-subscriber]
workspace = true

[[bin]]
name = "warrenguard-natpmp-request"
path = "src/bin/request.rs"

[lints]
workspace = true
