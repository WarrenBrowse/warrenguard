# WarrenGuard engine crate: a generic VPN-over-QUIC building block with no
# Warren-specific logic, reusable by any deployer.
[package]
name = "warrenguard-multihop"
description = "Multi-hop wire format and HPKE-based payload encryption, RFC 9180 (WarrenGuard engine)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Exposes test-only constructors (e.g. `IpAssignment::placeholder_for_test`) for
# downstream harnesses that bypass the real setup exchange. OFF by default; only
# ever enabled as a dev-dependency feature, never in a production dependency.
test-helpers = []

# Hybrid post-quantum multihop HPKE seal (X-Wing: X25519 + ML-KEM-768).
# OFF by default: the classical X25519 `/v1` seal stays the production
# default until the PQ path is real-exit validated. When enabled it adds the
# X-Wing KEM + the `/v2` PQ session (seal/open) alongside (never replacing)
# the classical path, and pulls in the ML-KEM / X25519 / SHA3 crypto. The
# wire structs that merely carry a signed ML-KEM key (the `/v2` exit
# descriptor field and its signing payload) are NOT gated here: a
# classical-only build must still parse and correctly reject a PQ descriptor.
pq-hpke = ["dep:ml-kem", "dep:kem", "dep:x25519-dalek", "dep:sha3", "dep:hkdf", "dep:sha2"]

[dependencies]
# HPKE RFC 9180 for client-to-exit end-to-end payload encryption (multi-message
# session). Pin exact: pre-1.0, breaking changes possible.
#
# NOT `hpke-rs` (Cryspen) which had 5 publicly disclosed vulns (nonce reuse,
# entropy reduction, zero-DH-check missing). See the Symbolic Software audit.
hpke = { version = "=0.13.0", default-features = false, features = ["alloc", "x25519"] }

# Per-packet AEAD used directly after deriving a one-time key via
# `AeadCtxS::export`. The design specifies a "multi-message session" with
# automatic seq, but the hpke 0.13.0 crate does not expose a seq setter; the
# auto-incrementing seq breaks the moment a packet is reordered or dropped on
# the QUIC unreliable datagram path. The correct multi-message pattern for an
# unreliable transport is: derive a per-packet symmetric key via the HPKE
# exporter (using `epoch || seq` as info for domain separation), then encrypt
# with `ChaCha20Poly1305` and a fixed all-zero nonce (safe because the key is
# unique per packet). Same pattern as QUIC's per-packet keys.
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }

# Ed25519 signatures for the future PKI chain (root -> operational -> exit/
# relay pubkeys).
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "rand_core", "zeroize"] }

# --- Post-quantum hybrid seal (X-Wing), all optional and gated by `pq-hpke`. ---
# ML-KEM-768 (FIPS 203). RustCrypto pure-Rust implementation; the deterministic
# keygen/encaps entry points let us replay the X-Wing draft known-answer tests.
ml-kem = { version = "0.2", default-features = false, features = ["deterministic", "zeroize"], optional = true }
# The `Decapsulate` trait ml-kem's decapsulation key implements. Pinned to the
# exact pre-release ml-kem 0.2.3 depends on so there is a single `kem` version
# and the trait impls line up (a mismatched `kem` would not satisfy the bound).
kem = { version = "=0.3.0-pre.0", default-features = false, optional = true }
# X25519 (RFC 7748) half of the X-Wing hybrid. The free `x25519()` function is
# the raw scalar mult used for the ephemeral DH; no `StaticSecret` feature
# needed. `zeroize` scrubs the derived scalar/shared-secret material.
x25519-dalek = { version = "2", default-features = false, features = ["zeroize"], optional = true }
# SHA3-256 is the X-Wing combiner hash (draft-connolly-cfrg-xwing-kem).
sha3 = { version = "0.10", default-features = false, optional = true }
# HKDF-SHA256 exporter deriving the per-packet keys from the X-Wing shared
# secret (the PQ analogue of the classical `AeadCtxS::export` key schedule).
hkdf = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

# Wire format encoding consistent with `warren-protocol` and `warren-tls/name`.
# `use-std` is required for `postcard::to_stdvec`; the workspace dep only
# enables `alloc` (which is enough for `from_bytes` but not for the std
# `Vec<u8>`-returning encoder Warren uses on the seal path).
postcard = { workspace = true, features = ["use-std"] }
serde = { workspace = true }

# Canonical `ExitId` lives in `warren-protocol`. The wire shape is byte-equal
# either way (postcard emits the raw 16 bytes, no length prefix), so swapping
# the local duplicate for the protocol re-export is a wire no-op.
warrenguard-wire = { path = "../warrenguard-wire" }

# Hex encoding for the human-facing TOML serialization of relay /v1
# descriptors. The crypto material lives in fixed-length arrays so the
# canonical wire format uses bare hex (no length prefix).
hex = { workspace = true }

# Zero-on-drop for secret material (private keys, AEAD contexts when dropped).
zeroize = { workspace = true }

# Error type Warren standard.
thiserror = { workspace = true }

# `rand_core 0.9` for the `CryptoRng + RngCore` trait bounds expected by
# `hpke::setup_sender`. The workspace pin is `rand = "0.10"`, which uses
# `rand_core 0.10`, and that breaks the trait-impl match with hpke 0.13
# (which still consumes the 0.9 traits). We therefore depend on the 0.9 line
# of `rand_core` directly for the trait surface, and on `rand_chacha 0.9`
# (dev-only) for the deterministic PRNG used in vector tests.
rand_core = { version = "0.9", default-features = false, features = ["os_rng"] }

[dev-dependencies]
proptest = "1"
sha2 = { workspace = true }
# Deterministic ChaCha20Rng for reproducible HPKE vector generation. Must be
# the 0.9 line (uses rand_core 0.9 traits) to interop with hpke 0.13's
# `setup_sender` rng parameter. See `tests/hpke_vectors_v1.rs`.
rand_chacha = "0.9"
# TOML round-trip for the relay descriptor PKI tests.
toml = { workspace = true }
# JSON for /v2 descriptor backward-compat tests (legacy descriptors stored as
# JSON in some operator tooling).
serde_json = { workspace = true }

[lints]
workspace = true
