# WarrenGuard engine crate: the client-side tunnel transport (QUIC client,
# bonded multi-conn session, per-platform TUN backends). No Warren-specific
# logic; the server lives in `warrenguard-server`.
[package]
name = "warrenguard-transport"
description = "Client-side tunnel transport: QUIC client, bonded multi-conn session, TUN backends (WarrenGuard engine)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
warrenguard-transport-core = { path = "../warrenguard-transport-core" }
warrenguard-pump = { path = "../warrenguard-pump" }
warrenguard-wire = { path = "../warrenguard-wire" }
warrenguard-tls = { path = "../warrenguard-tls" }
warrenguard-config = { path = "../warrenguard-config" }
warrenguard-multihop = { path = "../warrenguard-multihop" }
warrenguard-backoff = { path = "../warrenguard-backoff" }
warrenguard-daita = { path = "../warrenguard-daita" }
# Per-OS tunnel-socket bypass (SO_MARK / IP_BOUND_IF / IP_UNICAST_IF): keeps the
# QUIC carrier socket on the physical link so the split-default tunnel can drop
# the old `<exit_ip>/32` host route (Port Fail / TunnelCrack ServerIP fix).
# Lightweight (libc/windows-sys only), so it stays in the userland closure too;
# the proxy datapath simply configures no bypass.
warrenguard-socket-bypass = { path = "../warrenguard-socket-bypass" }
# TLS-over-TCP fallback carrier (anti-censorship datapath): the client dials this
# to the exit's cover domain on :443/tcp when the QUIC/UDP handshake fails on a
# UDP-hostile network. Plugs in at the quinn abstract-socket seam only; the QUIC
# engine, HPKE and obfuscation configs are untouched.
warrenguard-tcp-fallback = { path = "../warrenguard-tcp-fallback" }
# Raw socket construction for the TLS-over-TCP carrier's pre-connect bypass:
# under a full-tunnel system VPN the carrier's TCP socket must be marked/bound to
# the physical link BEFORE connect (via `warrenguard-socket-bypass`), which
# `TcpStream::connect` gives no seam for. Already transitive via tokio/quinn.
socket2 = { workspace = true }
# Privileged system-VPN routing (default-route split): the reassign loop
# installs the Linux v6 split route via `DefaultRouteSplitV6Guard`. Optional +
# feature-gated so the userland SDK (which consumes this crate for the session
# but never the system-VPN pump) does not pull the privileged killswitch-os/pfctl
# closure. System-VPN consumers enable `system-vpn`.
warrenguard-route-split = { path = "../warrenguard-route-split", optional = true }
quinn = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
ed25519-dalek = { workspace = true }
zeroize = { workspace = true }
tun-rs = { workspace = true }
postcard = { workspace = true }
rand = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
# Names `rustls::ClientConfig` in the carrier's cover-TLS seam (the config comes
# from `warrenguard-tls`; this dep is only to name the type at the boundary).
rustls = { workspace = true }
# rand_core 0.9 matches the trait bounds expected by `warrenguard-multihop`
# (HPKE 0.13 still consumes the 0.9 trait line); the workspace
# `rand = 0.10` is incompatible.
rand_core = { version = "0.9", default-features = false, features = ["os_rng"] }

# Android: read/write the VpnService-provided TUN fd via `nix` (safe POSIX
# wrappers) + tokio AsyncFd; `tun-rs` has no Android backend.
[target.'cfg(target_os = "android")'.dependencies]
nix = { version = "0.31", features = ["fs"] }

# Unix: name `EINPROGRESS` to recognise a non-blocking connect that has merely
# not completed yet (vs a real failure) on the carrier's pre-connect bypass path.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Enable Quinn's Apple fast UDP datapath (sendmsg_x/recvmsg_x batch syscalls) on
# macOS only. quinn-udp resolves to the warren-quinn fork via the workspace
# git-dep (package = "warren-quinn-udp"). NEVER enable on iOS.
[target.'cfg(target_os = "macos")'.dependencies]
quinn-udp = { workspace = true, features = ["fast-apple-datapath"] }

[features]
# Pulls the privileged system-VPN pump driver (`supervised_pump`, whose reassign
# loop installs OS routes via `warrenguard-route-split`). Off by default to keep
# the userland closure clean (SDK purity invariant). Enabled by system-VPN consumers.
system-vpn = ["dep:warrenguard-route-split"]
# Post-quantum (`/v2` X-Wing) multi-hop client datapath. Off by default: the
# classical `/v1` DHKEM(X25519) session stays the production default until the
# PQ path is real-exit validated.
pq-hpke = ["warrenguard-multihop/pq-hpke"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
ed25519-dalek = { workspace = true }
# Self-signed cover certificate for the carrier end-to-end test.
rcgen = { workspace = true }

# Resolve the loopback interface index (safe wrapper, no `unsafe`, which this
# crate forbids) to drive the real IP_BOUND_IF carrier-bypass dial test on macOS.
[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["net"] }

[lints]
workspace = true
