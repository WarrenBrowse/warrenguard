# WarrenGuard engine crate (kernelland): generic OS killswitch (nft/pf/WFP).
[package]
name = "warrenguard-killswitch-os"
description = "OS killswitch for the WarrenGuard tunnel: blocks out-of-tunnel leaks while a client is up (Linux nftables; macOS pf; Windows WFP planned). Generic, no Warren-specific logic."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
pfctl = "0.7"
# The interface addresses, which are what attributes a pf state entry to the
# interface its pass rule is scoped to: a state carries no interface name, only a
# local address. Safe wrapper over getifaddrs; already resolved in Cargo.lock.
getifaddrs = "0.6"

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
