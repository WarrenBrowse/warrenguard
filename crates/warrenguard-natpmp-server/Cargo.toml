# WarrenGuard engine crate: a generic VPN-over-QUIC building block with no
# Warren-specific logic, reusable by any deployer.
[package]
name = "warrenguard-natpmp-server"
description = "NAT-PMP RFC 6886 server providing port-forwarding on the exit (WarrenGuard engine)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
warrenguard-config = { path = "../warrenguard-config" }
warrenguard-natpmp-protocol = { path = "../warrenguard-natpmp-protocol" }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "time"] }

[lints]
workspace = true
