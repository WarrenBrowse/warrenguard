# WarrenGuard engine crate: a reference CLI that drives the engine as a generic
# VPN-over-QUIC tool ("like WireGuard"), with no Warren backend in the path. It
# is the human-facing companion to the generic-deployer e2e test.
[package]
name = "warrenguard-cli"
description = "Reference CLI for the WarrenGuard engine: keygen, a generic AllowAll server, and a raw-key client (WarrenGuard engine)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "warrenguard"
path = "src/main.rs"

[dependencies]
warrenguard-server = { path = "../warrenguard-server" }
warrenguard-transport = { path = "../warrenguard-transport" }
# Multi-hop exit termination datapath: the terminator loop, IP pool allocator,
# and the X25519 identity derivation the `serve --multihop` mode wires.
warrenguard-multihop-server = { path = "../warrenguard-multihop-server" }
# Multi-hop wire types (`ExitId`) shared with the dialing client.
warrenguard-multihop = { path = "../warrenguard-multihop" }
# The exit multi-hop inbound transport profile served to dialers.
warrenguard-transport-core = { path = "../warrenguard-transport-core" }
warrenguard-tls = { path = "../warrenguard-tls" }
warrenguard-identity = { path = "../warrenguard-identity", default-features = false }
warrenguard-wire = { path = "../warrenguard-wire" }
warrenguard-config = { path = "../warrenguard-config" }
anyhow = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
quinn = { workspace = true }
ed25519-dalek = { workspace = true }
parking_lot = { workspace = true }
data-encoding = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
tracing-subscriber = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
# The multi-hop loopback test drives a real `ClientSession`, whose HPKE setup
# consumes the rand_core 0.9 `CryptoRng + RngCore` surface (OsRng via UnwrapErr).
rand_core = { version = "0.9", default-features = false, features = ["os_rng"] }

[lints]
workspace = true
