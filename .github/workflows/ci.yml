name: CI

# The Linux jobs run on GitHub-hosted runners (ubuntu-24.04): free and
# unlimited for a public repo, and several times faster than the self-hosted
# libra pool was. The macOS jobs stay on the org's self-hosted Apple Silicon
# runner ([self-hosted, macOS, ARM64]).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

concurrency:
  # Cancel superseded runs on the same ref so a burst of pushes does not burn
  # runner time on commits nobody will look at.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  anti-refrag:
    name: anti-refragmentation gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: single-home twin detector (doc 94 / doc 47 s5)
        run: bash scripts/ci/anti-refrag.sh

  clippy:
    name: cargo clippy (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-24.04
          - name: macos
            runner: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        # The persistent self-hosted macOS runner already keeps target/ across
        # jobs, and rust-cache's target prune drops .d dep-info and corrupts the
        # restore there, so it caches only the registry. The ephemeral hosted
        # Linux runner starts empty and caches its target too.
        with:
          cache-targets: ${{ matrix.name == 'linux' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # --all-features lints the cfg-gated per-OS datapath (the Apple fast path,
      # the pfctl killswitch, the experimental TUN) on each native runner.
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # The default feature set is what a deployer builds, and a lint can fire
      # only there (an item a feature-gated facade re-exports is unreachable
      # without that feature), so it is linted too.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  clippy-windows:
    # No runner builds for Windows, so this is where the Windows code paths
    # (the killswitch, DNS push and routing drivers, the system tool resolver
    # and its FFI) get compiled and linted at all. The crates listed are the
    # ones carrying Windows code that need no C toolchain for the target.
    name: cargo clippy (windows target)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc
      - run: >-
          cargo clippy --locked --target x86_64-pc-windows-msvc
          -p warrenguard-systool -p warrenguard-killswitch-os
          -p warrenguard-route-split -p warrenguard-winroute
          -p warrenguard-socket-bypass -p warrenguard-tun-core
          --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The shared golden vectors are a private submodule (warren-vectors); the
      # conformance tests read them at runtime, so this job needs them checked
      # out. VECTORS_TOKEN is the org-level PAT with read access to the repos.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.VECTORS_TOKEN }}
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # nextest retries the in-process quinn loopback tunnel tests, which can hit
      # a quinn Drop/UDP-bind race on a loaded runner.
      - run: cargo nextest run --locked --workspace --all-targets --retries 2
      # The X-Wing / PQ-HPKE tests are gated behind the `pq-hpke` feature, which
      # the workspace run above does not enable, so the golden KATs would never
      # execute in CI (clippy only lints them). Run them explicitly.
      - run: cargo nextest run --locked -p warrenguard-multihop --features pq-hpke --retries 2
      # Same reasoning for the PQ multihop client datapath (rekey / resend-until-ack
      # state machine, epoch bootstrap ping) and for the system-VPN pump bodies
      # behind `system-vpn` (drain advisory interception, reconnect-window drops,
      # IpAssign reassign loop): otherwise only clippy ever sees them.
      - run: cargo nextest run --locked -p warrenguard-transport --features pq-hpke,system-vpn --retries 2
      # Every fleet exit build enables pq-hpke, which compiles the `/v2`
      # termination path in the exit datapath; without this run its tests
      # only ever pass clippy.
      - run: cargo nextest run --locked -p warrenguard-multihop-server --features pq-hpke --retries 2

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      # Supply-chain gate for a security-critical, public-bound data-plane. The
      # vendored quinn fork carries a pinned transport-parameters DoS fix, so
      # advisory drift on the QUIC stack must surface here.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      # Complements cargo-audit: bans, license allowlist and source pinning on
      # top of the advisory feed (config in deny.toml).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  quinn-advisory-watch:
    # cargo-audit and cargo-deny match advisories by (crate name, version), and
    # the fork ships RENAMED crates, so a quinn/quinn-proto/quinn-udp advisory
    # never matches this lockfile. Without this gate a fork base version that
    # goes advisory-affected between two nightly runs reaches main unseen.
    name: warren-quinn fork advisory watch
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ensure a TOML parser for python < 3.11
        # ubuntu-24.04 ships python 3.12, whose tomllib makes this a no-op; it
        # installs the pure-python tomli backport only on an older python
        # (bootstrapping pip through apt when the image lacks it).
        run: |
          python3 -c "import tomllib" 2>/dev/null && exit 0
          python3 -c "import tomli" 2>/dev/null && exit 0
          if ! python3 -m pip --version >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq python3-pip
          fi
          python3 -m pip install --user --quiet tomli
      # Hermetic first: the fixture test proves the watch actually fails on an
      # affected base version, on a missing upstream crate directory and on an
      # unparseable advisory, so a green real run below means something.
      - name: Hermetic fixture test for the advisory watch
        run: bash scripts/ci/test-check-quinn-advisories.sh
      - name: Check the quinn fork base versions against the RustSec advisory DB
        run: ./scripts/check-quinn-advisories.sh
